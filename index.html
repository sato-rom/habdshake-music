<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>通過検知＆サウンドアプリ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* スタート画面 */
    #startOverlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 24px;
      text-align: center;
    }

    #startBtn {
      margin-top: 24px;
      padding: 18px 40px;
      font-size: 1.25rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      border: none;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
      cursor: pointer;
    }

    /* カメラ表示エリア */
    .camera-wrapper {
      position: relative;
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 中央の検知ゾーン枠 */
    #detectZone {
      position: absolute;
      width: 36%;
      height: 65%;
      border: 3px dashed #38bdf8;
      border-radius: 16px;
      background: rgba(56, 189, 248, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      pointer-events: none;
    }

    #detectZone.active {
      border: 4px solid #10b981;
      background: rgba(16, 185, 129, 0.35);
      transform: scale(1.03);
    }

    #detectZone.triggered {
      border: 5px solid #f59e0b;
      background: rgba(245, 158, 11, 0.5);
    }

    .zone-label {
      background: rgba(15, 23, 42, 0.8);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      color: #e2e8f0;
    }

    /* カウント表示バッジ */
    #counterHud {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 10px 24px;
      border-radius: 30px;
      display: flex;
      align-items: baseline;
      gap: 8px;
      z-index: 10;
    }

    #currentCount {
      font-size: 2rem;
      font-weight: 800;
      color: #38bdf8;
    }

    /* 下部コントロールパネル */
    .controls {
      background: #1e293b;
      padding: 16px 20px;
      border-top: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.9rem;
    }

    .num-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .step-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
    }

    #targetCountDisplay {
      font-size: 1.3rem;
      font-weight: bold;
      color: #f59e0b;
      min-width: 44px;
      text-align: center;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #38bdf8;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }

    #resetBtn {
      background: #334155;
      color: #f8fafc;
    }

    #testSoundBtn {
      background: #0284c7;
      color: #fff;
    }

    #cameraSwitchBtn {
      background: #475569;
      color: #fff;
    }
  </style>
</head>
<body>

  <div id="startOverlay">
    <h1 style="font-size: 1.6rem; margin-bottom: 10px;">🚶 通過検知サウンド</h1>
    <p style="color: #94a3b8; font-size: 0.95rem; line-height: 1.6;">
      カメラの中央枠を人が指定回数通ると<br>自動で音を鳴らします。
    </p>
    <button id="startBtn" type="button">▶ カメラを起動して開始</button>
  </div>

  <div class="camera-wrapper">
    <video id="video" autoplay playsinline muted></video>

    <div id="counterHud">
      <span style="font-size: 0.9rem; color: #94a3b8;">通過数:</span>
      <span id="currentCount">0</span>
      <span style="font-size: 1rem; color: #cbd5e1;">/ <span id="hudTarget">3</span> 回</span>
    </div>

    <div id="detectZone">
      <span class="zone-label" id="zoneStatus">待機中</span>
    </div>
  </div>

  <div class="controls">
    <!-- 鳴らす回数の設定 -->
    <div class="ctrl-row">
      <span>🔔 音を鳴らす回数:</span>
      <div class="num-control">
        <button class="step-btn" id="minusBtn" type="button">−</button>
        <span id="targetCountDisplay">3回</span>
        <button class="step-btn" id="plusBtn" type="button">＋</button>
      </div>
    </div>

    <!-- 感度スライダー -->
    <div class="ctrl-row">
      <span style="white-space: nowrap;">🎚️ 検知感度:</span>
      <input type="range" id="sensitivitySlider" min="1" max="10" value="5" />
      <span id="sensitivityVal" style="width: 24px; text-align: right;">5</span>
    </div>

    <!-- ボタン群 -->
    <div class="btn-group">
      <button class="action-btn" id="resetBtn" type="button">🔄 リセット</button>
      <button class="action-btn" id="cameraSwitchBtn" type="button">📷 カメラ切替</button>
      <button class="action-btn" id="testSoundBtn" type="button">🔊 音テスト</button>
    </div>
  </div>

  <!-- 映像解析用の非表示キャンバス -->
  <canvas id="procCanvas" width="160" height="120" style="display: none;"></canvas>

  <script>
    const startOverlay = document.getElementById("startOverlay");
    const startBtn = document.getElementById("startBtn");
    const video = document.getElementById("video");
    const procCanvas = document.getElementById("procCanvas");
    const ctx = procCanvas.getContext("2d", { willReadFrequently: true });

    const detectZone = document.getElementById("detectZone");
    const zoneStatus = document.getElementById("zoneStatus");
    const currentCountEl = document.getElementById("currentCount");
    const hudTargetEl = document.getElementById("hudTarget");
    const targetCountDisplay = document.getElementById("targetCountDisplay");

    const minusBtn = document.getElementById("minusBtn");
    const plusBtn = document.getElementById("plusBtn");
    const sensitivitySlider = document.getElementById("sensitivitySlider");
    const sensitivityVal = document.getElementById("sensitivityVal");
    const resetBtn = document.getElementById("resetBtn");
    const testSoundBtn = document.getElementById("testSoundBtn");
    const cameraSwitchBtn = document.getElementById("cameraSwitchBtn");

    let targetCount = 3;      // 何回通ったら鳴らすか
    let currentCount = 0;     // 現在の通過回数
    let sensitivity = 5;      // 感度 (1〜10)
    let useFrontCamera = false;
    let currentStream = null;

    let prevFrameData = null;
    let isPersonInZone = false;
    let clearFrames = 0;      // 人が通り過ぎた後の安定フレーム数

    // Web Audio API でチャイム音（ピンポーン♪）を生成して鳴らす
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function playChime() {
      initAudio();
      const now = audioCtx.currentTime;

      // 1音目（ピン：シ4 = 987.77Hz）
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = "sine";
      osc1.frequency.setValueAtTime(987.77, now);
      gain1.gain.setValueAtTime(0.4, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.6);

      // 2音目（ポーン：ソ4 = 783.99Hz）
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = "sine";
      osc2.frequency.setValueAtTime(783.99, now + 0.35);
      gain2.gain.setValueAtTime(0.4, now + 0.35);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.3);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now + 0.35);
      osc2.stop(now + 1.3);
    }

    // カメラ起動処理
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      prevFrameData = null;
      isPersonInZone = false;

      const constraints = {
        video: {
          facingMode: useFrontCamera ? "user" : "environment",
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
      } catch (err) {
        alert("カメラの起動に失敗しました。カメラの許可設定を確認してください。\n" + err.message);
      }
    }

    // フレームごとの動き検知ループ
    function processVideo() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const w = procCanvas.width;
        const h = procCanvas.height;
        ctx.drawImage(video, 0, 0, w, h);

        // 中央の検知ゾーン（幅36%、高さ65%）のピクセルを取得
        const startX = Math.floor(w * 0.32);
        const startY = Math.floor(h * 0.175);
        const zoneW = Math.floor(w * 0.36);
        const zoneH = Math.floor(h * 0.65);

        const frame = ctx.getImageData(startX, startY, zoneW, zoneH).data;

        if (prevFrameData) {
          let changedPixels = 0;
          const totalPixels = zoneW * zoneH;
          // 感度に応じたピクセル輝度差のしきい値
          const pixelDiffThreshold = 55 - (sensitivity * 4);

          for (let i = 0; i < frame.length; i += 4) {
            const rDiff = Math.abs(frame[i] - prevFrameData[i]);
            const gDiff = Math.abs(frame[i + 1] - prevFrameData[i + 1]);
            const bDiff = Math.abs(frame[i + 2] - prevFrameData[i + 2]);
            const avgDiff = (rDiff + gDiff + bDiff) / 3;

            if (avgDiff > pixelDiffThreshold) {
              changedPixels++;
            }
          }

          const changeRatio = changedPixels / totalPixels;
          // 検知エリアの18%以上が動いたら「人が通っている」と判定
          const isMovingNow = changeRatio > 0.18;

          if (isMovingNow) {
            clearFrames = 0;
            if (!isPersonInZone) {
              // 新たに人が枠に入った瞬間！
              isPersonInZone = true;
              currentCount++;
              currentCountEl.textContent = currentCount;

              detectZone.classList.add("active");
              zoneStatus.textContent = "検知！";

              // 指定回数に達したら音を鳴らす
              if (currentCount >= targetCount) {
                playChime();
                detectZone.classList.add("triggered");
                zoneStatus.textContent = "🔔 達成！";

                // 1.5秒後にカウントを自動リセットして次のサイクルへ
                setTimeout(() => {
                  currentCount = 0;
                  currentCountEl.textContent = "0";
                  detectZone.classList.remove("triggered");
                }, 1500);
              }
            }
          } else {
            // 動きが止まってから約0.5秒（15フレーム）経過したら「通り過ぎた」とみなす
            if (isPersonInZone) {
              clearFrames++;
              if (clearFrames > 15) {
                isPersonInZone = false;
                detectZone.classList.remove("active");
                zoneStatus.textContent = "待機中";
              }
            }
          }
        }

        // 現在のフレームを保存（少しずつ背景に順応させるブレンド更新）
        if (!prevFrameData) {
          prevFrameData = new Uint8ClampedArray(frame);
        } else {
          for (let i = 0; i < frame.length; i++) {
            prevFrameData[i] = prevFrameData[i] * 0.7 + frame[i] * 0.3;
          }
        }
      }

      requestAnimationFrame(processVideo);
    }

    // UIイベント設定
    function updateTargetDisplay() {
      targetCountDisplay.textContent = `${targetCount}回`;
      hudTargetEl.textContent = targetCount;
    }

    minusBtn.addEventListener("click", () => {
      if (targetCount > 1) {
        targetCount--;
        updateTargetDisplay();
      }
    });

    plusBtn.addEventListener("click", () => {
      if (targetCount < 50) {
        targetCount++;
        updateTargetDisplay();
      }
    });

    sensitivitySlider.addEventListener("input", (e) => {
      sensitivity = parseInt(e.target.value, 10);
      sensitivityVal.textContent = sensitivity;
    });

    resetBtn.addEventListener("click", () => {
      currentCount = 0;
      currentCountEl.textContent = "0";
      isPersonInZone = false;
      detectZone.classList.remove("active", "triggered");
      zoneStatus.textContent = "待機中";
    });

    testSoundBtn.addEventListener("click", () => {
      playChime();
    });

    cameraSwitchBtn.addEventListener("click", () => {
      useFrontCamera = !useFrontCamera;
      startCamera();
    });

    startBtn.addEventListener("click", async () => {
      initAudio(); // スマホの音声ロックを解除
      await startCamera();
      startOverlay.style.display = "none";
      requestAnimationFrame(processVideo);
    });
  </script>
</body>
</html>
