<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>研究室 入退出ハンドシェイク</title>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .tab-header {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 580px;
    }

    .tab-btn {
      flex: 1;
      padding: 14px 10px;
      border: 1px solid #334155;
      background-color: var(--card-bg);
      color: var(--text-sub);
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background-color: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .page {
      display: none !important;
      width: 100%;
      max-width: 580px;
    }

    .page.active {
      display: flex !important;
      flex-direction: column;
      align-items: center;
    }

    .main-trigger {
      width: 100%;
      height: 260px;
      border: none;
      border-radius: 28px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6, #8b5cf6);
      color: white;
      font-size: 2.5rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 15px 30px -5px rgba(59, 130, 246, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .main-trigger:active {
      transform: scale(0.96);
    }

    .status-card, .settings-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 18px;
      width: 100%;
      border: 1px solid #334155;
      margin-bottom: 16px;
    }

    .status-card {
      text-align: center;
    }

    .now-playing {
      font-size: 1.05rem;
      font-weight: bold;
      color: #38bdf8;
      margin-top: 6px;
      word-break: break-all;
    }

    .input-box {
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 12px;
      color: white;
      width: 100%;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .add-btn {
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      width: 100%;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-bottom: 16px;
    }

    .track-item {
      background-color: #0f172a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid #334155;
    }

    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .track-title {
      font-weight: bold;
      font-size: 1rem;
      color: #f8fafc;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 75%;
    }

    .delete-btn {
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .bpm-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-sub);
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .bpm-row input {
      background: #0f172a;
      border: 1px solid #475569;
      color: #38bdf8;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.9rem;
      font-weight: bold;
      width: 60px;
      text-align: center;
    }

    .section-box {
      background: #1e293b;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-inputs-row {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      color: var(--text-sub);
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .time-inputs-row input[type="number"] {
      background-color: #0f172a;
      border: 1px solid #475569;
      color: #38bdf8;
      border-radius: 6px;
      padding: 4px;
      font-size: 0.85rem;
      text-align: center;
      font-weight: bold;
      width: 46px;
    }

    .preview-btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .preview-btn {
      flex: 1;
      min-width: 80px;
      padding: 8px 4px;
      border: none;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background-color: #3b82f6;
    }

    .preview-btn.stop { background-color: #ef4444; flex: 0 0 60px; }

    .add-section-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .add-section-row input {
      background: #0f172a;
      border: 1px solid #475569;
      color: white;
      border-radius: 6px;
      padding: 6px;
      font-size: 0.8rem;
      width: 120px;
    }

    .small-btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="tab-header">
    <button id="tabMain" class="tab-btn active" type="button">🚪 メイン画面</button>
    <button id="tabSettings" class="tab-btn" type="button">⚙️ 曲・詳細設定</button>
  </div>

  <!-- PAGE 1: メイン画面 -->
  <div id="pageMain" class="page active">
    <button id="mainTriggerBtn" class="main-trigger" type="button">
      🎵 TOUCH ME!
      <span style="font-size: 1rem; font-weight: normal; opacity: 0.9;">（1タップでダンススタート）</span>
    </button>

    <div class="status-card">
      <div style="font-size: 0.8rem; color: var(--text-sub);">STATUS</div>
      <div id="statusText" class="now-playing">クラウド接続中...</div>
    </div>
  </div>

  <!-- PAGE 2: 設定画面 -->
  <div id="pageSettings" class="page">
    <div class="settings-card">
      <h2 style="margin-top: 0; font-size: 1.15rem;">🎵 クラウド共有曲の追加</h2>

      <input type="text" id="trackNameInput" class="input-box" placeholder="曲名（例: ダンス曲A）">
      <input type="text" id="trackUrlInput" class="input-box" placeholder="Dropbox等の共有URL">
      <button id="addTrackBtn" class="add-btn" type="button">＋ 全端末へ曲を追加共有する</button>

      <div id="trackList"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhrOeqEaq3cw9IhJcmPKMEifKnyYL8cEA",
      authDomain: "music-a4ea1.firebaseapp.com",
      databaseURL: "https://music-a4ea1-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "music-a4ea1",
      storageBucket: "music-a4ea1.firebasestorage.app",
      messagingSenderId: "28054165490",
      appId: "1:28054165490:web:2b04d61dc84d7d91023d6b",
      measurementId: "G-8Y4PRBGEZ3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app, firebaseConfig.databaseURL);

    let audioFiles = [];
    let currentAudio = null;
    let fadeOutTimeout = null;
    let activeAudioContext = null;

    // Web Audio API カウントダウンビープ音
    function playCountBeeps(bpm, callback) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        activeAudioContext = ctx;

        const beatInterval = 60 / bpm;
        const now = ctx.currentTime;

        for (let i = 0; i < 4; i++) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.frequency.value = (i === 3) ? 1200 : 800;
          const startTime = now + (i * beatInterval);

          gain.gain.setValueAtTime(0.3, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.1);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(startTime);
          osc.stop(startTime + 0.1);
        }

        setTimeout(() => {
          if (activeAudioContext) {
            activeAudioContext.close();
            activeAudioContext = null;
          }
          callback();
        }, beatInterval * 4 * 1000);
      } catch(e) {
        // 万が一Web Audio APIが使えない環境でもフォールバックして曲を流す
        callback();
      }
    }

    // タブ切り替え
    function switchTab(tabName) {
      const tabMain = document.getElementById('tabMain');
      const tabSettings = document.getElementById('tabSettings');
      const pageMain = document.getElementById('pageMain');
      const pageSettings = document.getElementById('pageSettings');

      if (tabName === 'main') {
        tabMain.classList.add('active');
        tabSettings.classList.remove('active');
        pageMain.classList.add('active');
        pageSettings.classList.remove('active');
      } else {
        tabSettings.classList.add('active');
        tabMain.classList.remove('active');
        pageSettings.classList.add('active');
        pageMain.classList.remove('active');
      }
      stopAudio();
    }

    document.getElementById('tabMain').addEventListener('click', () => switchTab('main'));
    document.getElementById('tabSettings').addEventListener('click', () => switchTab('settings'));

    // Dropbox URL変換
    function convertToDirectLink(url) {
      if (!url) return "";
      let cleanUrl = url.trim();
      if (cleanUrl.includes("dropbox.com")) {
        return cleanUrl.replace("dl=0", "dl=1").replace("www.dropbox.com", "dl.dropboxusercontent.com");
      }
      return cleanUrl;
    }

    // クラウドリアルタイム同期
    const tracksDbRef = ref(db, "tracks");
    onValue(tracksDbRef, (snapshot) => {
      const data = snapshot.val();
      audioFiles = data ? Object.values(data) : [];
      renderSettingsList();

      const statusEl = document.getElementById('statusText');
      if (audioFiles.length > 0) {
        statusEl.textContent = `🟢 クラウド同期中（${audioFiles.length}曲共有済み）`;
      } else {
        statusEl.textContent = '待機中（「⚙️ 曲・詳細設定」から曲を追加してください）';
      }
    }, (error) => {
      document.getElementById('statusText').textContent = '⚠️ 接続エラー: ' + error.message;
    });

    // 🛠️ 曲の追加処理（安全な配列構造で保存）
    document.getElementById('addTrackBtn').addEventListener('click', async () => {
      const nameInput = document.getElementById("trackNameInput");
      const urlInput = document.getElementById("trackUrlInput");
      const name = nameInput.value.trim();
      const rawUrl = urlInput.value.trim();

      if (!name || !rawUrl) {
        alert("曲名とURLの両方を入力してください。");
        return;
      }

      const directUrl = convertToDirectLink(rawUrl);
      const id = "track_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5);

      const defaultSections = [
        { id: 'sec_4', label: '4拍', active: true, startMin: 0, startSec: 0, endMin: 0, endSec: 4 },
        { id: 'sec_8', label: '8拍', active: true, startMin: 0, startSec: 0, endMin: 0, endSec: 8 }
      ];

      const trackData = {
        id: id,
        name: name,
        url: directUrl,
        bpm: 120,
        sections: defaultSections
      };

      try {
        await set(ref(db, `tracks/${id}`), trackData);
        nameInput.value = "";
        urlInput.value = "";
      } catch (err) {
        alert("追加に失敗しました: " + err.message);
      }
    });

    // 設定リスト描画
    function renderSettingsList() {
      const container = document.getElementById('trackList');
      container.innerHTML = '';

      audioFiles.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = 'track-item';

        // 旧データ互換用フォールバック
        let sections = track.sections;
        if (!sections || !Array.isArray(sections)) {
          sections = [
            { id: 'sec_4', label: '4拍', active: true, startMin: track.b4StartMin || 0, startSec: track.b4StartSec || 0, endMin: track.b4EndMin || 0, endSec: track.b4EndSec || 4 },
            { id: 'sec_8', label: '8拍', active: true, startMin: track.b8StartMin || 0, startSec: track.b8StartSec || 0, endMin: track.b8EndMin || 0, endSec: track.b8EndSec || 8 }
          ];
        }

        let sectionsHTML = sections.map((sec, sIdx) => `
          <div class="section-box">
            <div class="section-title">
              <input type="checkbox" class="sec-active-check" data-id="${track.id}" data-sidx="${sIdx}" ${sec.active ? 'checked' : ''}>
              <span>${sec.label} 区間設定</span>
              <button class="small-btn sec-del-btn" data-id="${track.id}" data-sidx="${sIdx}" style="margin-left:auto; color:#ef4444;">削除</button>
            </div>
            <div class="time-inputs-row">
              <span>開始:</span>
              <input type="number" min="0" value="${sec.startMin ?? 0}" class="sec-time-input" data-id="${track.id}" data-sidx="${sIdx}" data-key="startMin">分
              <input type="number" min="0" max="59" value="${sec.startSec ?? 0}" class="sec-time-input" data-id="${track.id}" data-sidx="${sIdx}" data-key="startSec">秒
              <span style="margin:0 2px;">➔</span>
              <span>終了:</span>
              <input type="number" min="0" value="${sec.endMin ?? 0}" class="sec-time-input" data-id="${track.id}" data-sidx="${sIdx}" data-key="endMin">分
              <input type="number" min="0" max="59" value="${sec.endSec ?? 4}" class="sec-time-input" data-id="${track.id}" data-sidx="${sIdx}" data-key="endSec">秒
            </div>
          </div>
        `).join('');

        let previewBtnsHTML = sections.map((sec, sIdx) => `
          <button class="preview-btn" data-index="${index}" data-sidx="${sIdx}">▶ ${sec.label}試聴</button>
        `).join('');

        item.innerHTML = `
          <div class="track-header">
            <div class="track-title">${index + 1}. ${track.name}</div>
            <button class="delete-btn" data-id="${track.id}">削除</button>
          </div>
          
          <div class="bpm-row">
            <span>🥁 曲のBPM (カウント用):</span>
            <input type="number" min="40" max="240" value="${track.bpm || 120}" class="bpm-input" data-id="${track.id}">
          </div>

          ${sectionsHTML}

          <div class="add-section-row">
            <input type="text" placeholder="区間名 (例: 12拍)" class="new-sec-label" id="newSecLabel_${track.id}">
            <button class="small-btn add-sec-btn" data-id="${track.id}">＋ 区間追加</button>
          </div>

          <div class="preview-btn-group">
            ${previewBtnsHTML}
            <button class="preview-btn stop btn-stop">■ 停止</button>
          </div>
        `;
        container.appendChild(item);
      });

      // イベントリスナー設定
      container.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => removeTrack(e.target.dataset.id));
      });

      container.querySelectorAll('.bpm-input').forEach(input => {
        input.addEventListener('change', (e) => {
          updateTrackField(e.target.dataset.id, 'bpm', parseInt(e.target.value) || 120);
        });
      });

      container.querySelectorAll('.sec-active-check').forEach(chk => {
        chk.addEventListener('change', (e) => {
          const { id, sidx } = e.target.dataset;
          const track = audioFiles.find(t => t.id === id);
          if (track && track.sections && track.sections[sidx]) {
            track.sections[sidx].active = e.target.checked;
            updateTrackField(id, 'sections', track.sections);
          }
        });
      });

      container.querySelectorAll('.sec-time-input').forEach(input => {
        input.addEventListener('change', (e) => {
          const { id, sidx, key } = e.target.dataset;
          const track = audioFiles.find(t => t.id === id);
          if (track && track.sections && track.sections[sidx]) {
            track.sections[sidx][key] = parseFloat(e.target.value) || 0;
            updateTrackField(id, 'sections', track.sections);
          }
        });
      });

      container.querySelectorAll('.sec-del-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const { id, sidx } = e.target.dataset;
          const track = audioFiles.find(t => t.id === id);
          if (track && track.sections) {
            track.sections.splice(sidx, 1);
            updateTrackField(id, 'sections', track.sections);
          }
        });
      });

      container.querySelectorAll('.add-sec-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.target.dataset.id;
          const labelInput = document.getElementById(`newSecLabel_${id}`);
          const labelText = labelInput.value.trim() || '新区間';
          const track = audioFiles.find(t => t.id === id);
          if (track) {
            const sections = track.sections || [];
            sections.push({
              id: 'sec_' + Date.now(),
              label: labelText,
              active: true,
              startMin: 0, startSec: 0, endMin: 0, endSec: 4
            });
            updateTrackField(id, 'sections', sections);
          }
        });
      });

      container.querySelectorAll('.preview-btn[data-sidx]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const trackIdx = parseInt(e.target.dataset.index);
          const sIdx = parseInt(e.target.dataset.sidx);
          const track = audioFiles[trackIdx];
          const sec = track.sections[sIdx];
          const startSec = (sec.startMin * 60) + sec.startSec;
          const endSec = (sec.endMin * 60) + sec.endSec;
          
          playSequence(track, startSec, endSec, `【試聴: ${sec.label}】${track.name}`);
        });
      });

      container.querySelectorAll('.btn-stop').forEach(btn => {
        btn.addEventListener('click', stopAudio);
      });
    }

    function updateTrackField(id, field, value) {
      const updates = {};
      updates[`tracks/${id}/${field}`] = value;
      update(ref(db), updates);
    }

    async function removeTrack(id) {
      if (confirm("全端末からこの曲を削除しますか？")) {
        await remove(ref(db, `tracks/${id}`));
      }
    }

    function stopAudio() {
      if (fadeOutTimeout) clearTimeout(fadeOutTimeout);
      if (activeAudioContext) {
        activeAudioContext.close();
        activeAudioContext = null;
      }
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
    }

    document.getElementById('mainTriggerBtn').addEventListener('click', () => {
      if (audioFiles.length === 0) {
        alert('「⚙️ 曲・詳細設定」タブから曲を追加してください！');
        return;
      }

      let availableCandidates = [];

      audioFiles.forEach(track => {
        const sections = track.sections || [];
        const activeSections = sections.filter(s => s.active);
        activeSections.forEach(sec => {
          availableCandidates.push({ track, sec });
        });
      });

      if (availableCandidates.length === 0) {
        alert('再生可能な設定済みの曲・区間がありません。設定画面でチェックボックスをオンにしてください。');
        return;
      }

      const chosen = availableCandidates[Math.floor(Math.random() * availableCandidates.length)];
      const { track, sec } = chosen;

      const startSec = (sec.startMin * 60) + sec.startSec;
      const endSec = (sec.endMin * 60) + sec.endSec;

      playSequence(track, startSec, endSec, `【${sec.label}再生】${track.name}`);
    });

    function playSequence(track, startSec, endSec, statusMsg) {
      stopAudio();

      const statusEl = document.getElementById('statusText');
      const bpm = track.bpm || 120;

      statusEl.textContent = `⏱️ カウントダウン中 (BPM: ${bpm})...`;

      playCountBeeps(bpm, () => {
        playWithFade(track, startSec, endSec, statusMsg);
      });
    }

    function playWithFade(track, startSec, endSec, statusMsg) {
      const statusEl = document.getElementById('statusText');
      currentAudio = new Audio();
      currentAudio.crossOrigin = "anonymous";
      currentAudio.src = track.url;

      const durationSec = Math.max(0.5, endSec - startSec);
      const fadeTime = 0.5;

      currentAudio.onerror = () => {
        statusEl.textContent = '❌ 音声の読み込みに失敗しました（URLをご確認ください）';
      };

      currentAudio.onloadedmetadata = () => {
        currentAudio.currentTime = Math.min(startSec, currentAudio.duration - 1);
        currentAudio.volume = 0;
        
        currentAudio.play().then(() => {
          let fadeInStep = 0;
          const fadeInInterval = setInterval(() => {
            fadeInStep += 0.05;
            if (fadeInStep >= 1) {
              if (currentAudio) currentAudio.volume = 1;
              clearInterval(fadeInInterval);
            } else if (currentAudio) {
              currentAudio.volume = fadeInStep;
            }
          }, (fadeTime * 1000) / 20);

          const fadeOutStartTime = Math.max(0, (durationSec - fadeTime) * 1000);
          fadeOutTimeout = setTimeout(() => {
            if (!currentAudio) return;
            let fadeOutStep = 1;
            const fadeOutInterval = setInterval(() => {
              fadeOutStep -= 0.05;
              if (fadeOutStep <= 0) {
                if (currentAudio) currentAudio.volume = 0;
                clearInterval(fadeOutInterval);
                stopAudio();
                statusEl.textContent = `🟢 クラウド同期中（${audioFiles.length}曲共有済み）`;
              } else if (currentAudio) {
                currentAudio.volume = fadeOutStep;
              }
            }, (fadeTime * 1000) / 20);
          }, fadeOutStartTime);
        }).catch(() => {
          statusEl.textContent = '⚠️ タップして再生を許可してください';
        });
      };

      statusEl.textContent = statusMsg;
    }
  </script>
</body>
</html>
