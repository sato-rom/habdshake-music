<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>研究室 入退出ハンドシェイク - 波形エディタ</title>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151d30;
      --accent: #3b82f6;
      --accent-green: #10b981;
      --wave-color: #00ffcc;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-size: 1.05rem;
    }

    .tab-header {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 720px;
    }

    .tab-btn {
      flex: 1;
      padding: 16px 12px;
      border: 1px solid #2a3754;
      background-color: var(--card-bg);
      color: var(--text-sub);
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4);
    }

    .page { display: none !important; width: 100%; max-width: 720px; }
    .page.active { display: flex !important; flex-direction: column; align-items: center; }

    .mode-select-box {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid #2a3754;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .mode-select-box label {
      font-size: 0.95rem;
      font-weight: bold;
      color: #38bdf8;
      white-space: nowrap;
    }

    .mode-select-box select {
      background: #0b0f19;
      border: 1px solid #334155;
      color: white;
      border-radius: 10px;
      padding: 10px;
      font-size: 1rem;
      font-weight: bold;
      flex: 1;
      outline: none;
    }

    .main-trigger {
      width: 100%;
      height: 220px;
      border: none;
      border-radius: 28px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6, #8b5cf6);
      color: white;
      font-size: 2.8rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 18px 36px -6px rgba(59, 130, 246, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .main-trigger:active { transform: scale(0.96); }

    .se-section {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid #2a3754;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .se-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text-sub);
      margin-bottom: 12px;
      text-align: center;
    }

    .se-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .se-btn {
      padding: 14px 8px;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .se-btn:active { transform: scale(0.95); }
    .se-btn.kira { background: linear-gradient(135deg, #06b6d4, #0891b2); }
    .se-btn.cheer { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .se-btn.clap { background: linear-gradient(135deg, #10b981, #059669); }
    .se-btn.trumpet { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }

    .status-card, .settings-card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      border: 1px solid #2a3754;
      margin-bottom: 20px;
    }

    .input-box {
      background: #0b0f19;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px;
      color: white;
      width: 100%;
      margin-bottom: 12px;
      font-size: 1rem;
    }

    .add-btn {
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      width: 100%;
      font-weight: bold;
      font-size: 1.05rem;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .track-item {
      background-color: #0d1424;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 24px;
      border: 1px solid #2a3754;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .step-box {
      background: #151d30;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .step-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 120px;
      background: #000000;
      border: 1px solid #00ffcc44;
      border-radius: 8px;
      overflow: hidden;
    }

    canvas { width: 100%; height: 100%; display: block; }

    .ctrl-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .volume-box {
      background: #0b0f19;
      padding: 12px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid #2a3754;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider-row label {
      width: 120px;
      color: var(--text-sub);
      font-size: 0.9rem;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 12px;
      background: #1e293b;
      border-radius: 6px;
      border: 1px solid #334155;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
    }

    .val-text {
      width: 45px;
      font-size: 0.9rem;
      text-align: right;
      font-weight: bold;
      color: #38bdf8;
    }

    .small-num-input {
      background: #0b0f19;
      border: 1px solid #334155;
      color: #00ffcc;
      border-radius: 6px;
      padding: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      width: 80px;
      text-align: center;
    }

    .bpm-num-input {
      background: #0b0f19;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      border-radius: 6px;
      padding: 6px;
      font-size: 1rem;
      font-weight: bold;
      width: 70px;
      text-align: center;
    }

    .fine-btn {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .fine-btn:active { background: #38bdf8; color: #000; }

    .preview-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background-color: var(--accent);
    }
    .preview-btn.stop { background-color: #ef4444; flex: 0 0 70px; }
  </style>
</head>
<body>

  <div class="tab-header">
    <button id="tabMain" class="tab-btn active" type="button">🚪 メイン画面</button>
    <button id="tabSettings" class="tab-btn" type="button">⚙️ 曲・詳細波形編集</button>
  </div>

  <!-- PAGE 1: メイン画面 -->
  <div id="pageMain" class="page active">

    <div class="mode-select-box">
      <label for="playTrackSelect">🎵 再生する曲:</label>
      <select id="playTrackSelect">
        <option value="random">🎲 ランダムで選曲（おまかせ）</option>
      </select>
    </div>

    <button id="mainTriggerBtn" class="main-trigger" type="button">
      🎵 TOUCH ME!
      <span style="font-size: 1.1rem; font-weight: normal;">（1タップで即時再生）</span>
    </button>

    <!-- 🔊 4つの指定効果音ボタン -->
    <div class="se-section">
      <div class="se-title">🤝 フィニッシュ効果音</div>
      <div class="se-grid">
        <button class="se-btn kira" data-se="kira" type="button">✨ キラッ</button>
        <button class="se-btn cheer" data-se="cheer" type="button">🗣️ 歓声</button>
        <button class="se-btn clap" data-se="clap" type="button">👏 拍手</button>
        <button class="se-btn trumpet" data-se="trumpet" type="button">🎺 ラッパ</button>
      </div>
    </div>

    <div class="status-card" style="text-align: center;">
      <div style="font-size: 0.9rem; color: var(--text-sub);">STATUS</div>
      <div id="statusText" style="font-size: 1.2rem; font-weight: bold; color: #38bdf8;">接続中...</div>
    </div>
  </div>

  <!-- PAGE 2: 設定画面 -->
  <div id="pageSettings" class="page">
    <div class="settings-card">
      <h2 style="margin-top: 0; font-size: 1.2rem;">🎵 クラウド共有曲の追加</h2>
      <input type="text" id="trackNameInput" class="input-box" placeholder="曲名（例: ダンス曲A）">
      <input type="text" id="trackUrlInput" class="input-box" placeholder="Dropbox等の共有URL">
      <button id="addTrackBtn" class="add-btn" type="button">＋ 曲を追加して波形編集を開始</button>
      <div id="trackList"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBXIOyPImlqiPAX-4JbZ_LNZrzT9_SIazc",
      authDomain: "sotugyouken-2ec79.firebaseapp.com",
      databaseURL: "https://sotugyouken-2ec79-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "sotugyouken-2ec79",
      storageBucket: "sotugyouken-2ec79.firebasestorage.app",
      messagingSenderId: "682579514497",
      appId: "1:682579514497:web:0f8fe574fa01d5d4ade980",
      measurementId: "G-GQFZ41NYHR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app, firebaseConfig.databaseURL);

    let audioFiles = [];
    let currentAudio = null;
    let fadeOutTimeout = null;
    let autoCountInterval = null;
    let updateTimer = null;

    const decodedBuffers = new Map();

    // Web Audio API 合成音エンジン（確実かつラグなしで再生）
    function playSyntheticSE(type) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        if (type === 'kira') {
          // キラッ (高音の金属音・ベル)
          const freqs = [1567.98, 2093.00, 2637.02, 3135.96];
          freqs.forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now + i * 0.05);
            gain.gain.setValueAtTime(0.2, now + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.05);
            osc.stop(now + i * 0.05 + 0.4);
          });
        } else if (type === 'cheer') {
          // 歓声 (ノイズの帯域通過フィルタ)
          const bufferSize = ctx.sampleRate * 1.2;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1000, now);
          filter.Q.setValueAtTime(2, now);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.3, now + 0.15);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(now);
        } else if (type === 'clap') {
          // 拍手 (バーストノイズ)
          for (let i = 0; i < 6; i++) {
            const delay = i * 0.07 + Math.random() * 0.02;
            const bufSize = ctx.sampleRate * 0.08;
            const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let k = 0; k < bufSize; k++) d[k] = Math.random() * 2 - 1;

            const noise = ctx.createBufferSource();
            noise.buffer = buf;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.35, now + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.07);

            noise.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now + delay);
          }
        } else if (type === 'trumpet') {
          // ラッパ (パフッ/ファンファーレ風)
          const notes = [523.25, 659.25, 783.99];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + idx * 0.1);

            gain.gain.setValueAtTime(0.25, now + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.25);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.1);
            osc.stop(now + idx * 0.1 + 0.25);
          });
        }
      } catch(e) {}
    }

    function switchTab(tabName) {
      document.getElementById('tabMain').classList.toggle('active', tabName === 'main');
      document.getElementById('tabSettings').classList.toggle('active', tabName === 'settings');
      document.getElementById('pageMain').classList.toggle('active', tabName === 'main');
      document.getElementById('pageSettings').classList.toggle('active', tabName === 'settings');
      stopAudio();
    }

    document.getElementById('tabMain').addEventListener('click', () => switchTab('main'));
    document.getElementById('tabSettings').addEventListener('click', () => switchTab('settings'));

    function convertToDirectLink(url) {
      if (!url) return "";
      let clean = url.trim();
      return clean.includes("dropbox.com") ? clean.replace("dl=0", "dl=1").replace("www.dropbox.com", "dl.dropboxusercontent.com") : clean;
    }

    async function loadAudioBuffer(url) {
      if (decodedBuffers.has(url)) return decodedBuffers.get(url);
      try {
        const res = await fetch(url);
        const arrayBuf = await res.arrayBuffer();
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const decoded = await ctx.decodeAudioData(arrayBuf);
        decodedBuffers.set(url, decoded);
        return decoded;
      } catch(e) {
        return null;
      }
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec === null) return "00:00.00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      const ms = Math.floor((sec % 1) * 100);
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;
    }

    const tracksDbRef = ref(db, "tracks");
    onValue(tracksDbRef, (snapshot) => {
      const data = snapshot.val();
      audioFiles = data ? Object.values(data) : [];
      updateMainTrackSelector();
      renderList();
      document.getElementById('statusText').textContent = audioFiles.length > 0 ? `🟢 クラウド同期中（${audioFiles.length}曲）` : '待機中';
    });

    function updateMainTrackSelector() {
      const select = document.getElementById('playTrackSelect');
      const currentSelected = select.value;
      
      select.innerHTML = '<option value="random">🎲 ランダムで選曲（おまかせ）</option>';
      
      audioFiles.forEach((track, index) => {
        const opt = document.createElement('option');
        opt.value = track.id;
        opt.textContent = `🎯 ${index + 1}. ${track.name}`;
        select.appendChild(opt);
      });

      select.value = currentSelected;
    }

    document.getElementById('addTrackBtn').addEventListener('click', async () => {
      const name = document.getElementById("trackNameInput").value.trim();
      const rawUrl = document.getElementById("trackUrlInput").value.trim();
      if (!name || !rawUrl) return alert("曲名とURLを入力してください。");

      const directUrl = convertToDirectLink(rawUrl);
      const id = "track_" + Date.now();
      const trackData = {
        id, name, url: directUrl, bpm: 120,
        countVol: 1.0,
        musicVol: 1.0,
        mainStartSec: 0, mainEndSec: 30,
        sections: [
          { id: 'sec_8', label: '8拍使用区間', active: true, offsetStartSec: 0, offsetEndSec: 4, autoCount: true, triggerOffsetSec: 0 }
        ]
      };
      await set(ref(db, `tracks/${id}`), trackData);
      document.getElementById("trackNameInput").value = "";
      document.getElementById("trackUrlInput").value = "";
    });

    function renderList() {
      if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT')) return;
      const container = document.getElementById('trackList');
      container.innerHTML = '';

      audioFiles.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = 'track-item';

        const sec = (track.sections && track.sections[0]) ? track.sections[0] : {
          label: '8拍区間', active: true, offsetStartSec: 0, offsetEndSec: 4, autoCount: true, triggerOffsetSec: 0
        };

        const countVol = track.countVol !== undefined ? track.countVol : 1.0;
        const musicVol = track.musicVol !== undefined ? track.musicVol : 1.0;

        const mainStart = track.mainStartSec || 0;
        const mainEnd = track.mainEndSec || 30;
        const selectedDuration = Math.max(0.1, mainEnd - mainStart);

        item.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong style="font-size:1.1rem; color:#f8fafc;">${index + 1}. ${track.name}</strong>
            <button class="fine-btn del-btn" data-id="${track.id}" style="color:#ef4444; border-color:#ef4444;">削除</button>
          </div>

          <div class="volume-box">
            <div class="slider-row">
              <label>🎵 曲の音量</label>
              <input type="range" min="0" max="1" step="0.01" value="${musicVol}" class="vol-input" data-id="${track.id}" data-key="musicVol">
              <span class="val-text" id="disp_musicVol_${track.id}">${Math.round(musicVol * 100)}%</span>
            </div>
            <div class="slider-row">
              <label>🗣️ カウント音量</label>
              <input type="range" min="0" max="1" step="0.01" value="${countVol}" class="vol-input" data-id="${track.id}" data-key="countVol">
              <span class="val-text" id="disp_countVol_${track.id}">${Math.round(countVol * 100)}%</span>
            </div>
          </div>

          <div class="step-box">
            <div class="step-title">
              <span>ステップ1: 曲全体の切り出し（使用する大枠範囲）</span>
              <span style="color:#00ffcc;">長: ${selectedDuration.toFixed(2)}秒</span>
            </div>
            <div class="canvas-container">
              <canvas id="canvas_full_${track.id}"></canvas>
            </div>
            <div class="ctrl-row">
              <label style="font-size:0.85rem;">開始:</label>
              <input type="number" step="0.1" value="${mainStart.toFixed(2)}" class="small-num-input input-main" data-id="${track.id}" data-key="mainStartSec">
              <label style="font-size:0.85rem;">終了:</label>
              <input type="number" step="0.1" value="${mainEnd.toFixed(2)}" class="small-num-input input-main" data-id="${track.id}" data-key="mainEndSec">
            </div>
          </div>

          <div class="step-box" style="border-color:#38bdf8;">
            <div class="step-title" style="color:#38bdf8;">
              <span>ステップ2: 拡大波形での8拍・裏カウント細密設定</span>
              <span>再生範囲: ${formatTime(mainStart + (sec.offsetStartSec||0))} 〜 ${formatTime(mainStart + (sec.offsetEndSec||4))}</span>
            </div>

            <div class="ctrl-row" style="background:#0b0f19; padding:8px 12px; border-radius:6px; justify-content:space-between;">
              <span style="font-size:0.9rem; color:#38bdf8; font-weight:bold;">⏱️ カウントBPM設定:</span>
              <div style="display:flex; align-items:center; gap:6px;">
                <input type="number" min="40" max="240" value="${track.bpm || 120}" class="bpm-num-input input-bpm" data-id="${track.id}">
                <span style="font-size:0.85rem; color:var(--text-sub);">BPM</span>
              </div>
            </div>

            <div class="canvas-container" style="height:140px; border-color:#38bdf8;">
              <canvas id="canvas_sub_${track.id}"></canvas>
            </div>

            <div class="ctrl-row">
              <span style="font-size:0.85rem;">8拍範囲(秒):</span>
              <button class="fine-btn step-sub-btn" data-id="${track.id}" data-key="offsetStartSec" data-delta="-0.05">-0.05s</button>
              <input type="number" step="0.01" value="${(sec.offsetStartSec||0).toFixed(2)}" class="small-num-input input-sub" data-id="${track.id}" data-key="offsetStartSec">
              <button class="fine-btn step-sub-btn" data-id="${track.id}" data-key="offsetStartSec" data-delta="0.05">+0.05s</button>
              <span>〜</span>
              <button class="fine-btn step-sub-btn" data-id="${track.id}" data-key="offsetEndSec" data-delta="-0.05">-0.05s</button>
              <input type="number" step="0.01" value="${(sec.offsetEndSec||4).toFixed(2)}" class="small-num-input input-sub" data-id="${track.id}" data-key="offsetEndSec">
              <button class="fine-btn step-sub-btn" data-id="${track.id}" data-key="offsetEndSec" data-delta="0.05">+0.05s</button>
            </div>

            <div class="ctrl-row" style="background:#0b0f19; padding:8px; border-radius:6px; margin-top:4px;">
              <input type="checkbox" class="chk-autocount" data-id="${track.id}" ${sec.autoCount ? 'checked':''}>
              <span style="font-size:0.85rem;">自動裏カウント位置:</span>
              <input type="number" step="0.01" value="${(sec.triggerOffsetSec||0).toFixed(2)}" class="small-num-input input-sub" data-id="${track.id}" data-key="triggerOffsetSec">
              <span style="font-size:0.8rem; color:var(--text-sub);">秒目</span>
            </div>
          </div>

          <div class="ctrl-row">
            <button class="preview-btn play-btn" data-id="${track.id}">▶ 設定した8拍区間を再生試聴</button>
            <button class="preview-btn stop btn-stop">■ 停止</button>
          </div>
        `;
        container.appendChild(item);
        drawWaveforms(track);
      });

      container.querySelectorAll('.del-btn').forEach(b => b.addEventListener('click', (e) => remove(ref(db, `tracks/${e.target.dataset.id}`))));

      container.querySelectorAll('.vol-input').forEach(input => {
        input.addEventListener('input', (e) => {
          const { id, key } = e.target.dataset;
          const val = parseFloat(e.target.value);
          const disp = document.getElementById(`disp_${key}_${id}`);
          if (disp) disp.textContent = `${Math.round(val * 100)}%`;

          clearTimeout(updateTimer);
          updateTimer = setTimeout(() => updateTrackField(id, key, val), 200);
        });
      });

      container.querySelectorAll('.input-main').forEach(input => {
        input.addEventListener('change', (e) => {
          const { id, key } = e.target.dataset;
          updateTrackField(id, key, Math.max(0, parseFloat(e.target.value) || 0));
        });
      });

      container.querySelectorAll('.input-bpm').forEach(input => {
        input.addEventListener('change', (e) => {
          const id = e.target.dataset.id;
          const val = Math.max(40, Math.min(240, parseInt(e.target.value) || 120));
          updateTrackField(id, 'bpm', val);
        });
      });

      container.querySelectorAll('.input-sub').forEach(input => {
        input.addEventListener('change', (e) => {
          const { id, key } = e.target.dataset;
          updateSubField(id, key, Math.max(0, parseFloat(e.target.value) || 0));
        });
      });

      container.querySelectorAll('.step-sub-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const { id, key, delta } = e.target.dataset;
          const track = audioFiles.find(t => t.id === id);
          if (track && track.sections && track.sections[0]) {
            const current = track.sections[0][key] || 0;
            updateSubField(id, key, Math.max(0, current + parseFloat(delta)));
          }
        });
      });

      container.querySelectorAll('.chk-autocount').forEach(chk => {
        chk.addEventListener('change', (e) => {
          const id = e.target.dataset.id;
          const track = audioFiles.find(t => t.id === id);
          if (track && track.sections && track.sections[0]) {
            track.sections[0].autoCount = e.target.checked;
            updateTrackField(id, 'sections', track.sections);
          }
        });
      });

      container.querySelectorAll('.play-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const track = audioFiles.find(t => t.id === e.target.dataset.id);
          if (track) playTrack(track);
        });
      });

      container.querySelectorAll('.btn-stop').forEach(btn => btn.addEventListener('click', stopAudio));
    }

    async function drawWaveforms(track) {
      const buf = await loadAudioBuffer(track.url);
      if (!buf) return;

      const mainStart = track.mainStartSec || 0;
      const mainEnd = track.mainEndSec || 30;
      const sec = (track.sections && track.sections[0]) ? track.sections[0] : {};
      const subStart = sec.offsetStartSec || 0;
      const subEnd = sec.offsetEndSec || 4;

      const canvasFull = document.getElementById(`canvas_full_${track.id}`);
      if (canvasFull) renderWaveOnCanvas(canvasFull, buf, 0, buf.duration, mainStart, mainEnd, '#00ffcc', '#ff005544');

      const canvasSub = document.getElementById(`canvas_sub_${track.id}`);
      if (canvasSub) renderWaveOnCanvas(canvasSub, buf, mainStart, mainEnd, mainStart + subStart, mainStart + subEnd, '#38bdf8', '#38bdf844');
    }

    function renderWaveOnCanvas(canvas, buffer, viewStartSec, viewEndSec, highlightStartSec, highlightEndSec, waveColor, highlightColor) {
      const ctx = canvas.getContext('2d');
      const width = canvas.width = canvas.clientWidth;
      const height = canvas.height = canvas.clientHeight;
      ctx.clearRect(0, 0, width, height);

      const rawData = buffer.getChannelData(0);
      const sampleRate = buffer.sampleRate;
      const startSample = Math.floor(viewStartSec * sampleRate);
      const endSample = Math.floor(viewEndSec * sampleRate);
      const totalSamples = endSample - startSample;
      const step = Math.ceil(totalSamples / width);
      const amp = height / 2;

      const viewDuration = viewEndSec - viewStartSec;
      const hLeft = ((highlightStartSec - viewStartSec) / viewDuration) * width;
      const hRight = ((highlightEndSec - viewStartSec) / viewDuration) * width;
      ctx.fillStyle = highlightColor;
      ctx.fillRect(hLeft, 0, hRight - hLeft, height);

      ctx.lineWidth = 1.5;
      ctx.strokeStyle = waveColor;
      ctx.beginPath();

      for (let i = 0; i < width; i++) {
        let min = 1.0, max = -1.0;
        for (let j = 0; j < step; j++) {
          const idx = startSample + (i * step) + j;
          if (idx < rawData.length) {
            const val = rawData[idx];
            if (val < min) min = val;
            if (val > max) max = val;
          }
        }
        ctx.moveTo(i, (1 + min) * amp);
        ctx.lineTo(i, (1 + max) * amp);
      }
      ctx.stroke();
    }

    function updateTrackField(id, field, value) {
      const updates = {};
      updates[`tracks/${id}/${field}`] = value;
      update(ref(db), updates);
    }

    function updateSubField(id, key, val) {
      const track = audioFiles.find(t => t.id === id);
      if (track && track.sections && track.sections[0]) {
        track.sections[0][key] = val;
        clearTimeout(updateTimer);
        updateTimer = setTimeout(() => updateTrackField(id, 'sections', track.sections), 200);
      }
    }

    function stopAudio() {
      if (fadeOutTimeout) clearTimeout(fadeOutTimeout);
      if (autoCountInterval) clearInterval(autoCountInterval);
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    }

    document.getElementById('mainTriggerBtn').addEventListener('click', () => {
      if (audioFiles.length === 0) return alert('⚙️ 曲・詳細波形編集タブから曲を追加してください');
      
      const selectVal = document.getElementById('playTrackSelect').value;
      let chosenTrack = null;

      if (selectVal === 'random') {
        chosenTrack = audioFiles[Math.floor(Math.random() * audioFiles.length)];
      } else {
        chosenTrack = audioFiles.find(t => t.id === selectVal);
        if (!chosenTrack) chosenTrack = audioFiles[0];
      }

      playTrack(chosenTrack);
    });

    function playTrack(track) {
      stopAudio();
      const mainStart = track.mainStartSec || 0;
      const sec = (track.sections && track.sections[0]) ? track.sections[0] : {};
      const startSec = mainStart + (sec.offsetStartSec || 0);
      const endSec = mainStart + (sec.offsetEndSec || 4);
      const triggerSec = mainStart + (sec.triggerOffsetSec || 0);

      const musicVol = track.musicVol !== undefined ? track.musicVol : 1.0;
      const countVol = track.countVol !== undefined ? track.countVol : 1.0;

      document.getElementById('statusText').textContent = `▶ 再生中: ${track.name}`;

      currentAudio = new Audio();
      currentAudio.crossOrigin = "anonymous";
      currentAudio.src = track.url;
      currentAudio.currentTime = startSec;
      currentAudio.volume = musicVol;

      let triggered = false;
      currentAudio.play().then(() => {
        if (sec.autoCount) {
          autoCountInterval = setInterval(() => {
            if (currentAudio && !triggered && currentAudio.currentTime >= triggerSec) {
              triggered = true;
              playOverlayBeep(track.bpm || 120, countVol);
            }
          }, 20);
        }

        const durationMs = Math.max(500, (endSec - startSec) * 1000);
        fadeOutTimeout = setTimeout(() => {
          stopAudio();
          document.getElementById('statusText').textContent = `🟢 クラウド同期中（${audioFiles.length}曲）`;
        }, durationMs);
      });
    }

    function playOverlayBeep(bpm, volumeRatio) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const interval = 60 / (bpm || 120);
        const now = ctx.currentTime;
        const vol = volumeRatio !== undefined ? volumeRatio : 1.0;

        for (let i = 0; i < 4; i++) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.frequency.value = i === 3 ? 1200 : 800;

          const start = now + i * interval;
          gain.gain.setValueAtTime(0.3 * vol, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.08);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.08);
        }
      } catch(e) {}
    }

    // 効果音ボタンクリックイベント
    document.querySelectorAll('.se-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const type = e.target.closest('.se-btn').dataset.se;
        playSyntheticSE(type);
      });
    });
  </script>
</body>
</html>
