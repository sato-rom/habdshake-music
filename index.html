<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>サウンド＆カウントコントローラー</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding: 20px 16px;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.3rem;
      text-align: center;
      color: #38bdf8;
    }

    .counter-box {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 20px;
      padding: 18px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .counter-box.triggered {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.15);
    }

    .count-numbers {
      font-size: 2.8rem;
      font-weight: 800;
      color: #38bdf8;
      margin: 4px 0;
    }

    .count-tap-btn {
      width: 100%;
      padding: 18px;
      margin-top: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      border: none;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
      cursor: pointer;
    }

    .count-tap-btn:active {
      transform: scale(0.98);
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.9rem;
    }

    .url-input-group {
      display: flex;
      gap: 6px;
      flex: 1;
    }

    #musicUrlInput {
      flex: 1;
      background: #0f172a;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 0.85rem;
    }

    #loadUrlBtn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 0 14px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .num-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .step-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
    }

    .val-badge {
      font-size: 1.1rem;
      font-weight: bold;
      color: #f59e0b;
      min-width: 64px;
      text-align: center;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #38bdf8;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      flex: 1;
      padding: 13px 8px;
      border-radius: 12px;
      border: none;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }

    #playStopBtn {
      background: #10b981;
      color: #0f172a;
    }

    #resetBtn {
      background: #334155;
      color: #f8fafc;
    }

    #songStatus {
      font-size: 0.8rem;
      color: #94a3b8;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎵 サウンド＆カウント操作</h1>

    <!-- カウント表示＆タップエリア -->
    <div class="counter-box" id="counterBox">
      <div style="font-size: 0.85rem; color: #94a3b8;">現在のカウント / 目標回数</div>
      <div class="count-numbers">
        <span id="currentCount">0</span>
        <span style="font-size: 1.2rem; color: #cbd5e1;">/ <span id="targetHud">3</span> 回</span>
      </div>
      <button class="count-tap-btn" id="countUpBtn" type="button">＋1 カウントする</button>
    </div>

    <!-- 曲URL入力 -->
    <div class="ctrl-row">
      <span style="white-space: nowrap;">🔗 曲URL:</span>
      <div class="url-input-group">
        <input type="text" id="musicUrlInput" value="./music.mp3" placeholder="./music.mp3 または https://..." />
        <button id="loadUrlBtn" type="button">読込</button>
      </div>
    </div>

    <div id="songStatus">🎵 読込待機中...</div>

    <!-- 鳴らす回数の設定 -->
    <div class="ctrl-row">
      <span>🔔 曲を鳴らす回数:</span>
      <div class="num-control">
        <button class="step-btn" id="countMinusBtn" type="button">−</button>
        <span class="val-badge" id="targetCountDisplay">3回</span>
        <button class="step-btn" id="countPlusBtn" type="button">＋</button>
      </div>
    </div>

    <!-- 曲の長さ（再生秒数）の設定 -->
    <div class="ctrl-row">
      <span>⏱️ 曲の長さ:</span>
      <div class="num-control">
        <button class="step-btn" id="durMinusBtn" type="button">−</button>
        <span class="val-badge" id="durationDisplay">最後まで</span>
        <button class="step-btn" id="durPlusBtn" type="button">＋</button>
      </div>
    </div>

    <!-- 音量スライダー -->
    <div class="ctrl-row">
      <span style="white-space: nowrap;">🔊 音量:</span>
      <input type="range" id="volumeSlider" min="0" max="100" value="100" />
      <span id="volumeVal" style="width: 42px; text-align: right;">100%</span>
    </div>

    <!-- 再生・リセットボタン -->
    <div class="btn-group">
      <button class="action-btn" id="playStopBtn" type="button">▶ 今すぐ再生 / 停止</button>
      <button class="action-btn" id="resetBtn" type="button">🔄 リセット</button>
    </div>
  </div>

  <script>
    const INITIAL_MUSIC_URL = "./music.mp3";

    const counterBox = document.getElementById("counterBox");
    const currentCountEl = document.getElementById("currentCount");
    const targetHud = document.getElementById("targetHud");
    const countUpBtn = document.getElementById("countUpBtn");

    const musicUrlInput = document.getElementById("musicUrlInput");
    const loadUrlBtn = document.getElementById("loadUrlBtn");
    const songStatus = document.getElementById("songStatus");

    const countMinusBtn = document.getElementById("countMinusBtn");
    const countPlusBtn = document.getElementById("countPlusBtn");
    const targetCountDisplay = document.getElementById("targetCountDisplay");

    const durMinusBtn = document.getElementById("durMinusBtn");
    const durPlusBtn = document.getElementById("durPlusBtn");
    const durationDisplay = document.getElementById("durationDisplay");

    const volumeSlider = document.getElementById("volumeSlider");
    const volumeVal = document.getElementById("volumeVal");

    const playStopBtn = document.getElementById("playStopBtn");
    const resetBtn = document.getElementById("resetBtn");

    let targetCount = 3;
    let currentCount = 0;
    let playDurationSec = 0;
    let currentVolume = 1.0;
    let stopTimerId = null;

    const musicPlayer = new Audio();
    musicPlayer.crossOrigin = "anonymous";
    musicPlayer.preload = "auto";

    function loadMusicFromUrl(url) {
      const trimmed = url.trim();
      if (!trimmed) return;

      stopMusic();
      musicPlayer.src = encodeURI(trimmed);
      musicPlayer.volume = currentVolume;
      musicPlayer.load();

      songStatus.textContent = `⏳ 読込中: ${trimmed}`;
      songStatus.style.color = "#38bdf8";
    }

    musicPlayer.addEventListener("canplaythrough", () => {
      songStatus.textContent = `✅ 準備OK: ${musicUrlInput.value}`;
      songStatus.style.color = "#10b981";
    });

    musicPlayer.addEventListener("error", () => {
      songStatus.textContent = "❌ 読込エラー: URLまたはファイル名を確認してください";
      songStatus.style.color = "#ef4444";
    });

    musicPlayer.addEventListener("ended", () => {
      counterBox.classList.remove("triggered");
    });

    function playMusic() {
      if (stopTimerId) clearTimeout(stopTimerId);
      musicPlayer.currentTime = 0;
      musicPlayer.volume = currentVolume;

      musicPlayer.play().then(() => {
        counterBox.classList.add("triggered");
        if (playDurationSec > 0) {
          stopTimerId = setTimeout(() => {
            stopMusic();
          }, playDurationSec * 1000);
        }
      }).catch(() => {
        songStatus.textContent = "⚠️ 再生エラー: URLを確認するか再度お試しください";
        songStatus.style.color = "#f59e0b";
      });
    }

    function stopMusic() {
      if (stopTimerId) clearTimeout(stopTimerId);
      musicPlayer.pause();
      musicPlayer.currentTime = 0;
      counterBox.classList.remove("triggered");
    }

    // カウントボタン
    countUpBtn.addEventListener("click", () => {
      currentCount++;
      currentCountEl.textContent = currentCount;

      if (currentCount >= targetCount) {
        playMusic();
        setTimeout(() => {
          currentCount = 0;
          currentCountEl.textContent = "0";
        }, 1200);
      }
    });

    // URL読込
    loadUrlBtn.addEventListener("click", () => {
      loadMusicFromUrl(musicUrlInput.value);
    });

    // 目標カウント調整
    countMinusBtn.addEventListener("click", () => {
      if (targetCount > 1) {
        targetCount--;
        targetCountDisplay.textContent = `${targetCount}回`;
        targetHud.textContent = targetCount;
      }
    });

    countPlusBtn.addEventListener("click", () => {
      if (targetCount < 99) {
        targetCount++;
        targetCountDisplay.textContent = `${targetCount}回`;
        targetHud.textContent = targetCount;
      }
    });

    // 曲の長さ調整
    const DURATION_STEPS = [0, 2, 3, 5, 10, 15, 20, 30, 45, 60];
    let durIndex = 0;

    function updateDurationDisplay() {
      playDurationSec = DURATION_STEPS[durIndex];
      durationDisplay.text
