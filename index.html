<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>研究室 入退出ハンドシェイク</title>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-size: 1.1rem;
    }

    .tab-header {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      width: 100%;
      max-width: 680px;
    }

    .tab-btn {
      flex: 1;
      padding: 18px 12px;
      border: 1px solid #334155;
      background-color: var(--card-bg);
      color: var(--text-sub);
      border-radius: 16px;
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background-color: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4);
    }

    .page {
      display: none !important;
      width: 100%;
      max-width: 680px;
    }

    .page.active {
      display: flex !important;
      flex-direction: column;
      align-items: center;
    }

    .main-trigger {
      width: 100%;
      height: 260px;
      border: none;
      border-radius: 32px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6, #8b5cf6);
      color: white;
      font-size: 2.8rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 18px 36px -6px rgba(59, 130, 246, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .main-trigger:active {
      transform: scale(0.96);
    }

    .status-card, .settings-card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      border: 1px solid #334155;
      margin-bottom: 20px;
    }

    .status-card {
      text-align: center;
    }

    .now-playing {
      font-size: 1.25rem;
      font-weight: bold;
      color: #38bdf8;
      margin-top: 8px;
      word-break: break-all;
    }

    .input-box {
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 16px;
      color: white;
      width: 100%;
      margin-bottom: 12px;
      font-size: 1.1rem;
    }

    .add-btn {
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .track-item {
      background-color: #0f172a;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid #334155;
    }

    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .track-title {
      font-weight: bold;
      font-size: 1.2rem;
      color: #f8fafc;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 75%;
    }

    .delete-btn {
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }

    .config-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
      color: var(--text-sub);
      background: #1e293b;
      padding: 14px 16px;
      border-radius: 12px;
      flex-wrap: wrap;
    }

    .config-row select, .config-row input[type="number"] {
      background: #0f172a;
      border: 1px solid #475569;
      color: #38bdf8;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 1rem;
      font-weight: bold;
    }

    .volume-box {
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-size: 1rem;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-row label {
      width: 130px;
      color: var(--text-sub);
      font-size: 1rem;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 16px;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid #475569;
      outline: none;
      touch-action: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
    }

    input[type="range"]::-moz-range-thumb {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
      border: none;
    }

    .section-box {
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: bold;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title input[type="checkbox"] {
      width: 22px;
      height: 22px;
    }

    .count-setting-row {
      background: #0f172a;
      padding: 10px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: var(--text-sub);
      flex-wrap: wrap;
    }

    .count-setting-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }

    .range-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .range-label {
      font-size: 0.95rem;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
    }

    .range-label span.val {
      color: #38bdf8;
      font-weight: bold;
      font-size: 1.05rem;
    }

    .preview-btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .preview-btn {
      flex: 1;
      min-width: 100px;
      padding: 12px 6px;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background-color: #3b82f6;
    }

    .preview-btn.stop { background-color: #ef4444; flex: 0 0 70px; }

    .add-section-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .add-section-row input {
      background: #0f172a;
      border: 1px solid #475569;
      color: white;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.95rem;
      width: 150px;
    }

    .small-btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="tab-header">
    <button id="tabMain" class="tab-btn active" type="button">🚪 メイン画面</button>
    <button id="tabSettings" class="tab-btn" type="button">⚙️ 曲・詳細設定</button>
  </div>

  <!-- PAGE 1: メイン画面 -->
  <div id="pageMain" class="page active">
    <button id="mainTriggerBtn" class="main-trigger" type="button">
      🎵 TOUCH ME!
      <span style="font-size: 1.2rem; font-weight: normal; opacity: 0.9;">（1タップで即時再生）</span>
    </button>

    <div class="status-card">
      <div style="font-size: 0.95rem; color: var(--text-sub);">STATUS</div>
      <div id="statusText" class="now-playing">クラウド接続中...</div>
    </div>
  </div>

  <!-- PAGE 2: 設定画面 -->
  <div id="pageSettings" class="page">
    <div class="settings-card">
      <h2 style="margin-top: 0; font-size: 1.3rem;">🎵 クラウド共有曲の追加</h2>

      <input type="text" id="trackNameInput" class="input-box" placeholder="曲名（例: ダンス曲A）">
      <input type="text" id="trackUrlInput" class="input-box" placeholder="Dropbox等の共有URL">
      <button id="addTrackBtn" class="add-btn" type="button">＋ 全端末へ曲を追加共有する</button>

      <div id="trackList"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBXIOyPImlqiPAX-4JbZ_LNZrzT9_SIazc",
      authDomain: "sotugyouken-2ec79.firebaseapp.com",
      databaseURL: "https://sotugyouken-2ec79-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "sotugyouken-2ec79",
      storageBucket: "sotugyouken-2ec79.firebasestorage.app",
      messagingSenderId: "682579514497",
      appId: "1:682579514497:web:0f8fe574fa01d5d4ade980",
      measurementId: "G-GQFZ41NYHR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app, firebaseConfig.databaseURL);

    let audioFiles = [];
    let currentAudio = null;
    let fadeOutTimeout = null;
    let activeAudioContext = null;
    let updateTimer = null;
    let autoCountCheckInterval = null;
    let hasCountTriggered = false;

    const audioCache = new Map();
    const trackDurations = new Map();

    function preloadAudio(url) {
      if (!url || audioCache.has(url)) return;
      const audio = new Audio();
      audio.crossOrigin = "anonymous";
      audio.preload = "auto";
      audio.src = url;
      audio.onloadedmetadata = () => {
        trackDurations.set(url, audio.duration || 180);
        renderSettingsList();
      };
      audioCache.set(url, audio);
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds === null) return "00:00.00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      const ms = Math.floor((seconds % 1) * 100);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
    }

    // 指定されたタイミングで自動発動する裏カウント処理
    function playOverlayCount(bpm, countVol, countVoice) {
      const beatInterval = 60 / (bpm || 120);
      const volumeRatio = countVol !== undefined ? countVol : 1.0;

      if (countVoice === 'voice' && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const counts = ['1', '2', '3', '4'];
        let idx = 0;

        const speakNext = () => {
          if (idx >= counts.length) return;
          const uttr = new SpeechSynthesisUtterance(counts[idx]);
          uttr.lang = 'en-US';
          uttr.rate = Math.min(2, Math.max(0.8, (bpm || 120) / 120));
          uttr.volume = volumeRatio;
          
          uttr.onend = () => {
            idx++;
            if (idx < counts.length) {
              setTimeout(speakNext, Math.max(0, (beatInterval * 1000) - 150));
            }
          };

          uttr.onerror = () => {
            idx++;
            speakNext();
          };

          window.speechSynthesis.speak(uttr);
        };
        speakNext();
      } else {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioCtx();

          const now = ctx.currentTime;
          for (let i = 0; i < 4; i++) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.frequency.value = (i === 3) ? 1200 : 800;
            const startTime = now + (i * beatInterval);

            gain.gain.setValueAtTime(0.3 * volumeRatio, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.08);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(startTime);
            osc.stop(startTime + 0.08);
          }

          setTimeout(() => {
            ctx.close();
          }, beatInterval * 4 * 1000 + 100);
        } catch (e) {}
      }
    }

    function switchTab(tabName) {
      const tabMain = document.getElementById('tabMain');
      const tabSettings = document.getElementById('tabSettings');
      const pageMain = document.getElementById('pageMain');
      const pageSettings = document.getElementById('pageSettings');

      if (tabName === 'main') {
        tabMain.classList.add('active');
        tabSettings.classList.remove('active');
        pageMain.classList.add('active');
        pageSettings.classList.remove('active');
      } else {
        tabSettings.classList.add('active');
        tabMain.classList.remove('active');
        pageSettings.classList.add('active');
        pageMain.classList.remove('active');
      }
      stopAudio();
    }

    document.getElementById('tabMain').addEventListener('click', () => switchTab('main'));
    document.getElementById('tabSettings').addEventListener('click', () => switchTab('settings'));

    function convertToDirectLink(url) {
      if (!url) return "";
      let cleanUrl = url.trim();
      if (cleanUrl.includes("dropbox.com")) {
        return cleanUrl.replace("dl=0", "dl=1").replace("www.dropbox.com", "dl.dropboxusercontent.com");
      }
      return cleanUrl;
    }

    const tracksDbRef = ref(db, "tracks");
    onValue(tracksDbRef, (snapshot) => {
      const data = snapshot.val();
      audioFiles = data ? Object.values(data) : [];
      
      audioFiles.forEach(track => {
        if (track.url) preloadAudio(track.url);
      });

      renderSettingsList();

      const statusEl = document.getElementById('statusText');
      if (audioFiles.length > 0) {
        statusEl.textContent = `🟢 クラウド同期中（${audioFiles.length}曲共有済み）`;
      } else {
        statusEl.textContent = '待機中（「⚙️ 曲・詳細設定」から曲を追加してください）';
      }
    }, (error) => {
      document.getElementById('statusText').textContent = '⚠️ 接続エラー: ' + error.message;
    });

    document.getElementById('addTrackBtn').addEventListener('click', async () => {
      const nameInput = document.getElementById("trackNameInput");
      const urlInput = document.getElementById("trackUrlInput");
      const name = nameInput.value.trim();
      const rawUrl = urlInput.value.trim();

      if (!name || !rawUrl) {
        alert("曲名とURLの両方を入力してください。");
        return;
      }

      const directUrl = convertToDirectLink(rawUrl);
      const id = "track_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5);

      const defaultSections = [
        { id: 'sec_4', label: '4拍', active: true, startTotalSec: 0, endTotalSec: 4, autoCount: false, countTriggerSec: 0 },
        { id: 'sec_8', label: '8拍', active: true, startTotalSec: 0, endTotalSec: 8, autoCount: false, countTriggerSec: 0 }
      ];

      const trackData = {
        id: id,
        name: name,
        url: directUrl,
        bpm: 120,
        countVoice: 'beep',
        countVol: 1.0,
        musicVol: 1.0,
        sections: defaultSections
      };

      try {
        await set(ref(db, `tracks/${id}`), trackData);
        nameInput.value = "";
        urlInput.value = "";
      } catch (err) {
        alert("追加に失敗しました: " + err.message);
      }
    });

    function renderSettingsList() {
      if (document.activeElement && document.activeElement.tagName === 'INPUT' && document.activeElement.type === 'range') {
        return;
      }

      const container = document.getElementById('trackList');
      container.innerHTML = '';

      audioFiles.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = 'track-item';

        const currentCountVoice = track.countVoice !== undefined ? track.countVoice : 'beep';
        const currentCountVol = track.countVol !== undefined ? track.countVol : 1.0;
        const currentMusicVol = track.musicVol !== undefined ? track.musicVol : 1.0;
        const maxDuration = trackDurations.get(track.url) || 180;

        let sections = track.sections;
        if (!sections || !Array.isArray(sections)) {
          sections = [
            { id: 'sec_4', label: '4拍', active: true, startTotalSec: 0, endTotalSec: 4, autoCount: false, countTriggerSec: 0 },
            { id: 'sec_8', label: '8拍', active: true, startTotalSec: 0, endTotalSec: 8, autoCount: false, countTriggerSec: 0 }
          ];
        }

        let sectionsHTML = sections.map((sec, sIdx) => {
          let startVal = sec.startTotalSec !== undefined ? sec.startTotalSec : ((sec.startMin || 0) * 60 + (sec.startSec || 0));
          let endVal = sec.endTotalSec !== undefined ? sec.endTotalSec : ((sec.endMin || 0) * 60 + (sec.endSec || 4));
          let autoCount = sec.autoCount || false;
          let triggerSec = sec.countTriggerSec !== undefined ? sec.countTriggerSec : startVal;

          return `
            <div class="section-box">
              <div class="section-title">
                <input type="checkbox" class="sec-active-check" data-id="${track.id}" data-sidx="${sIdx}" ${sec.active ? 'checked' : ''}>
                <span>${sec.label} 区間設定</span>
                <button class="small-btn sec-del-btn" data-id="${track.id}" data-sidx="${sIdx}" style="margin-left:auto; color:#ef4444;">削除</button>
              </div>
              
              <div class="range-group">
                <div class="range-label">
                  <span>開始位置:</span>
                  <span class="val" id="disp_start_${track.id}_${sIdx}">${formatTime(startVal)}</span>
                </div>
                <input type="range" min="0" max="${maxDuration}" step="0.05" value="${startVal}" class="sec-range-input" data-id="${track.id}" data-sidx="${sIdx}" data-key="startTotalSec">
              </div>

              <div class="range-group">
                <div class="range-label">
                  <span>終了位置:</span>
                  <span class="val" id="disp_end_${track.id}_${sIdx}">${formatTime(endVal)}</span>
                </div>
                <input type="range" min="0" max="${maxDuration}" step="0.05" value="${endVal}" class="sec-range-input" data-id="${track.id}" data-sidx="${sIdx}" data-key="endTotalSec">
              </div>

              <!-- ⏱️ 自動カウント発動設定 -->
              <div class="count-setting-row">
                <input type="checkbox" class="auto-count-check" data-id="${track.id}" data-sidx="${sIdx}" ${autoCount ? 'checked' : ''}>
                <span>この区間で自動裏カウントを鳴らす</span>
              </div>

              ${autoCount ? `
              <div class="range-group" style="padding-left: 10px;">
                <div class="range-label">
                  <span>⏱️ カウント自動鳴らし開始タイミング:</span>
                  <span class="val" id="disp_trigger_${track.id}_${sIdx}">${formatTime(triggerSec)}</span>
                </div>
                <input type="range" min="${startVal}" max="${endVal}" step="0.05" value="${triggerSec}" class="sec-range-input" data-id="${track.id}" data-sidx="${sIdx}" data-key="countTriggerSec">
              </div>
              ` : ''}
            </div>
          `;
        }).join('');

        let previewBtnsHTML = sections.map((sec, sIdx) => `
          <button class="preview-btn" data-index="${index}" data-sidx="${sIdx}">▶ ${sec.label}試聴</button>
        `).join('');

        item.innerHTML = `
          <div class="track-header">
            <div class="track-title">${index + 1}. ${track.name}</div>
            <button class="delete-btn" data-id="${track.id}">削除</button>
          </div>

          <div class="config-row">
            <span>⏱️ カウント音種:</span>
            <select class="count-voice-select" data-id="${track.id}">
              <option value="beep" ${currentCountVoice === 'beep' ? 'selected' : ''}>電子音 (ピッ)</option>
              <option value="voice" ${currentCountVoice === 'voice' ? 'selected' : ''}>ボイス (英語)</option>
            </select>

            <span style="margin-left:auto;">BPM:</span>
            <input type="number" min="40" max="240" value="${track.bpm || 120}" class="bpm-input" data-id="${track.id}" style="width:65px; text-align:center;">
          </div>

          <div class="volume-box">
            <div class="slider-row">
              <label>🗣️ 自動カウント音量</label>
              <input type="range" min="0" max="1" step="0.01" value="${currentCountVol}" class="vol-input" data-id="${track.id}" data-key="countVol">
              <span class="val-text" id="disp_vol_countVol_${track.id}" style="width: 45px; font-size: 0.95rem; text-align: right; font-weight: bold;">${Math.round(currentCountVol * 100)}%</span>
            </div>
            <div class="slider-row">
              <label>🎵 音源（曲）音量</label>
              <input type="range" min="0" max="1" step="0.01" value="${currentMusicVol}" class="vol-input" data-id="${track.id}" data-key="musicVol">
              <span class="val-text" id="disp_vol_musicVol_${track.id}" style="width: 45px; font-size: 0.95rem; text-align: right; font-weight: bold;">${Math.round(currentMusicVol * 100)}%</span>
            </div>
          </div>

          ${sectionsHTML}

          <div class="add-section-row">
            <input type="text" placeholder="区間名 (例: 12拍)" class="new-sec-label" id="newSecLabel_${track.id}">
            <button class="small-btn add-sec-btn" data-id="${track.id}">＋ 区間追加</button>
          </div>

          <div class="preview-btn-group">
            ${previewBtnsHTML}
            <button class="preview-btn stop btn-stop">■ 停止</button>
          </div>
        `;
        container.appendChild(item);
      });

      container.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => removeTrack(e.target.dataset.id));
      });

      container.querySelectorAll('.count-voice-select').forEach(sel => {
        sel.addEventListener('change', (e) => updateTrackField(e.target.dataset.id, 'countVoice', e.target.value));
      });

      container.querySelectorAll('.bpm-input').forEach(input => {
        input.addEventListener('change', (e) => updateTrackField(e.target.dataset.id, 'bpm', parseInt(e.target.value) || 120));
      });

      container.querySelectorAll('.vol-input').forEach(input => {
        input.addEventListener('input', (e) => {
          const { id, key } = e.target.dataset;
          const val = parseFloat(e.target.value);
          const disp = document.getElementById(`disp_vol_${key}_${id}`);
          if (disp) disp.textContent = `${Math.round(val * 100)}%`;

          clearTimeout(updateTimer);
          updateTimer = setTimeout(() => updateTrackField(id, key, val), 200);
        });
      });

      container.querySelectorAll('.auto-count-check').forEach(chk => {
        chk.addEventListener('change', (e) => {
          const { id, sidx } = e.target.dataset;
          const track = audioFiles.find(t => t.id === id);
          if (track && track.sections && track.sections[sidx]) {
            track.sections[sidx].autoCount = e.target.checked;
            updateTrackField(id, 'sections', track.sections);
          }
        });
      });

      container.querySelectorAll('.sec-range-input').forEach(input => {
        input.addEventListener('input', (e) => {
          const { id, sidx, key } = e.target.dataset;
          const val = parseFloat(e.target.value);
          
          let labelType = 'start';
          if (key === 'endTotalSec') labelType = 'end';
          if (key === 'countTriggerSec') labelType = 'trigger';

          const disp = document.getElementById(`disp_${labelType}_${id}_${sidx}`);
          if (disp) disp.textContent = formatTime(val);

          const track = audioFiles.find(t => t.id === id);
          if (track && track.sections && track.sections[sidx]) {
            track.sections[sidx][key] = val;
            clearTimeout(updateTimer);
            updateTimer = setTimeout(() => updateTrackField(id, 'sections', track.sections), 200);
          }
        });
      });

      container.querySelectorAll('.sec-active-check').forEach(chk => {
        chk.addEventListener('change', (e) => {
          const { id, sidx } = e.target.dataset;
          const track = audioFiles.find(t => t.id === id);
          if (track && track.sections && track.sections[sidx]) {
            track.sections[sidx].active = e.target.checked;
            updateTrackField(id, 'sections', track.sections);
          }
        });
      });

      container.querySelectorAll('.sec-del-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const { id, sidx } = e.target.dataset;
          const track = audioFiles.find(t => t.id === id);
          if (track && track.sections) {
            track.sections.splice(sidx, 1);
            updateTrackField(id, 'sections', track.sections);
          }
        });
      });

      container.querySelectorAll('.add-sec-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.target.dataset.id;
          const labelInput = document.getElementById(`newSecLabel_${id}`);
          const labelText = labelInput.value.trim() || '新区間';
          const track = audioFiles.find(t => t.id === id);
          if (track) {
            const sections = track.sections || [];
            sections.push({
              id: 'sec_' + Date.now(),
              label: labelText,
              active: true,
              startTotalSec: 0,
              endTotalSec: 4,
              autoCount: false,
              countTriggerSec: 0
            });
            updateTrackField(id, 'sections', sections);
          }
        });
      });

      container.querySelectorAll('.preview-btn[data-sidx]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const trackIdx = parseInt(e.target.dataset.index);
          const sIdx = parseInt(e.target.dataset.sidx);
          const track = audioFiles[trackIdx];
          const sec = track.sections[sIdx];
          
          playWithFade(track, sec, `【試聴: ${sec.label}】${track.name}`);
        });
      });

      container.querySelectorAll('.btn-stop').forEach(btn => {
        btn.addEventListener('click', stopAudio);
      });
    }

    function updateTrackField(id, field, value) {
      const updates = {};
      updates[`tracks/${id}/${field}`] = value;
      update(ref(db), updates);
    }

    async function removeTrack(id) {
      if (confirm("全端末からこの曲を削除しますか？")) {
        await remove(ref(db, `tracks/${id}`));
      }
    }

    function stopAudio() {
      if (fadeOutTimeout) clearTimeout(fadeOutTimeout);
      if (autoCountCheckInterval) clearInterval(autoCountCheckInterval);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      hasCountTriggered = false;
    }

    document.getElementById('mainTriggerBtn').addEventListener('click', () => {
      if (audioFiles.length === 0) {
        alert('「⚙️ 曲・詳細設定」タブから曲を追加してください！');
        return;
      }

      let availableCandidates = [];

      audioFiles.forEach(track => {
        const sections = track.sections || [];
        const activeSections = sections.filter(s => s.active);
        activeSections.forEach(sec => {
          availableCandidates.push({ track, sec });
        });
      });

      if (availableCandidates.length === 0) {
        alert('再生可能な設定済みの曲・区間がありません。設定画面でチェックボックスをオンにしてください。');
        return;
      }

      const chosen = availableCandidates[Math.floor(Math.random() * availableCandidates.length)];
      const { track, sec } = chosen;

      playWithFade(track, sec, `【${sec.label}再生】${track.name}`);
    });

    function playWithFade(track, sec, statusMsg) {
      stopAudio();

      const statusEl = document.getElementById('statusText');
      const targetMusicVol = track.musicVol !== undefined ? track.musicVol : 1.0;
      
      const startSec = sec.startTotalSec !== undefined ? sec.startTotalSec : ((sec.startMin || 0) * 60 + (sec.startSec || 0));
      const endSec = sec.endTotalSec !== undefined ? sec.endTotalSec : ((sec.endMin || 0) * 60 + (sec.endSec || 4));
      const autoCount = sec.autoCount || false;
      const triggerSec = sec.countTriggerSec !== undefined ? sec.countTriggerSec : startSec;

      if (audioCache.has(track.url)) {
        currentAudio = audioCache.get(track.url);
      } else {
        currentAudio = new Audio();
        currentAudio.crossOrigin = "anonymous";
        currentAudio.src = track.url;
      }

      const durationSec = Math.max(0.5, endSec - startSec);
      const fadeTime = 0.3;

      currentAudio.onerror = () => {
        statusEl.textContent = '❌ 音声の読み込みに失敗しました（URLをご確認ください）';
      };

      const startPlayback = () => {
        currentAudio.currentTime = Math.min(startSec, (currentAudio.duration || 999) - 0.5);
        currentAudio.volume = 0;
        
        currentAudio.play().then(() => {
          // ⏱️ 再生時間監視ループ（自動カウントトリガー用）
          if (autoCount) {
            autoCountCheckInterval = setInterval(() => {
              if (currentAudio && !hasCountTriggered) {
                if (currentAudio.currentTime >= triggerSec) {
                  hasCountTriggered = true;
                  playOverlayCount(track.bpm, track.countVol, track.countVoice);
                }
              }
            }, 30);
          }

          let fadeInStep = 0;
          const fadeInInterval = setInterval(() => {
            fadeInStep += 0.1;
            if (fadeInStep >= 1) {
              if (currentAudio) currentAudio.volume = targetMusicVol;
              clearInterval(fadeInInterval);
            } else if (currentAudio) {
              currentAudio.volume = fadeInStep * targetMusicVol;
            }
          }, (fadeTime * 1000) / 10);

          const fadeOutStartTime = Math.max(0, (durationSec - fadeTime) * 1000);
          fadeOutTimeout = setTimeout(() => {
            if (!currentAudio) return;
            let fadeOutStep = 1;
            const fadeOutInterval = setInterval(() => {
              fadeOutStep -= 0.1;
              if (fadeOutStep <= 0) {
                if (currentAudio) currentAudio.volume = 0;
                clearInterval(fadeOutInterval);
                stopAudio();
                statusEl.textContent = `🟢 クラウド同期中（${audioFiles.length}曲共有済み）`;
              } else if (currentAudio) {
                currentAudio.volume = fadeOutStep * targetMusicVol;
              }
            }, (fadeTime * 1000) / 10);
          }, fadeOutStartTime);
        }).catch(() => {
          statusEl.textContent = '⚠️ 画面を一度タップして再生を許可してください';
        });
      };

      if (currentAudio.readyState >= 1) {
        startPlayback();
      } else {
        currentAudio.onloadedmetadata = startPlayback;
      }

      statusEl.textContent = statusMsg;
    }
  </script>
</body>
